name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audio:check
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Per-test durations (also in the job summary), kept to compare runs.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-timings
          path: test-results/e2e-timings.json
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
