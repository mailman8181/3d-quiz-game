name: PR Preview (fork cleanup)

# Removes a fork PR's preview when the PR is closed (ADR-0013). Runs in the base repository
# and only touches the gh-pages branch; no code from the PR is checked out.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  remove:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Remove the preview folder
        env:
          PR: ${{ github.event.number }}
        run: |
          dir="pr-preview/pr-${PR}"
          if [ ! -d "$dir" ]; then echo "No preview for PR $PR"; exit 0; fi
          git rm -rq "$dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Remove fork preview for PR $PR"
          git push
